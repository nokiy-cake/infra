---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nofx-init
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/nofx/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nofx-secrets
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/nofx/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: nofx-init
    - name: external-secrets-release
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nofx-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/nofx/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: nofx-secrets
    - name: cilium
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nofx-config
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/nofx/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: nofx-release
    - name: traefik-config
    - name: cert-manager-letsencrypt
    - name: external-dns-release
  patches:
    - patch: |-
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: nofx
          namespace: nofx
          annotations:
            external-dns.alpha.kubernetes.io/hostname: nofx.yuzu.nokiy.net
            external-dns.alpha.kubernetes.io/ttl: "300"
        spec:
          tls:
            - hosts:
                - nofx.yuzu.nokiy.net
              secretName: nofx-yuzu-tls
          rules:
            - host: nofx.yuzu.nokiy.net
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: nofx-frontend
                        port:
                          name: http
      target:
        kind: Ingress
        name: nofx
        namespace: nofx
