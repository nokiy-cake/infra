apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-init
  namespace: flux-system
spec:
  dependsOn:
    - name: k3s
  interval: 1m
  path: ./common/cert-manager/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-release
  namespace: flux-system
spec:
  dependsOn:
    - name: k3s
  interval: 1m
  path: ./common/cert-manager/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-letsencrypt
  namespace: flux-system
spec:
  dependsOn:
    - name: k3s
    - name: external-secrets-config
  interval: 1m
  path: ./common/cert-manager/letsencrypt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
