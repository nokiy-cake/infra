apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-init
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/tailscale/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/tailscale/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: tailscale-init
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-release
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/tailscale/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  patches:
    - patch: |
        spec:
          values:
            operatorConfig:
              hostname: yuzu-operator
              defaultTags:
                - "tag:yuzu-operator"
            proxyConfig:
              defaultTags: "tag:yuzu"
      target:
        kind: HelmRelease
        name: tailscale-operator
  dependsOn:
    - name: tailscale-secrets
