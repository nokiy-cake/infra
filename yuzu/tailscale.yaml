apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-init
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/tailscale/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/tailscale/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: tailscale-init
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/tailscale/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  patches:
    - target:
        kind: HelmRelease
        name: tailscale-operator
        namespace: tailscale
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: tailscale-operator
          namespace: tailscale
        spec:
          values:
            operatorConfig:
              hostname: yuzu-operator
              defaultTags:
                - tag:yuzu-operator
            proxyConfig:
              defaultTags:
                - tag:yuzu
  dependsOn:
    - name: tailscale-secrets
