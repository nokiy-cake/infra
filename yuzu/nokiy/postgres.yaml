apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  storage:
    size: 1Gi
    storageClass: local-path
  managed:
    roles:
    - name: nokiy-documents
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: postgres-nokiy-documents
    - name: nokiy-auth
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: postgres-nokiy-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-postgres-rw
spec:
  cluster:
    name: postgres
  instances: 3
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "10"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nokiy-documents
spec:
  name: documents
  owner: nokiy-documents
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nokiy-auth
spec:
  name: auth
  owner: nokiy-auth
  cluster:
    name: postgres
