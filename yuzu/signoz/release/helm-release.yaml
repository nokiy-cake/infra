apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signoz
  namespace: signoz
spec:
  interval: 5m
  chart:
    spec:
      chart: signoz
      version: "0.93.1"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: flux-system
  values:
    global:
      storageClass: hcloud-volumes
    clickhouse:
      persistence:
        size: 10Gi
    signoz:
      ingress:
        enabled: true
        className: traefik
        hosts:
        - host: signoz.nokiy.net
          paths:
            - path: /
              pathType: ImplementationSpecific
              port: 8080
        tls:
        - secretName: signoz-tls
          hosts:
            - signoz.nokiy.net
      otelCollector:
        ingress:
          enabled: true
          className: traefik
          hosts:
          - host: otel.nokiy.net
            paths:
            - path: /
              pathType: ImplementationSpecific
              port: 4317
          - host: grpc.otel.nokiy.net
            paths:
            - path: /
              pathType: ImplementationSpecific
              port: 4317
          - host: http.otel.nokiy.net
            paths:
            - path: /
              pathType: ImplementationSpecific
              port: 4318
          tls:
          - secretName: otel-tls
            hosts:
              - "otel.nokiy.net"
              - "*.otel.nokiy.net"
