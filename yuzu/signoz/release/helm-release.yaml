apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signoz
  namespace: signoz
spec:
  interval: 5m
  chart:
    spec:
      chart: signoz
      version: "0.93.1"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: flux-system
  values:
    global:
      storageClass: hcloud-volumes
    clickhouse:
      persistence:
        size: 10Gi
    signoz:
      ingress:
        enabled: true
        className: traefik
        hosts:
          - host: signoz.nokiy.net
            paths:
              - /
        tls:
          - secretName: signoz-tls
            hosts:
              - signoz.nokiy.net
