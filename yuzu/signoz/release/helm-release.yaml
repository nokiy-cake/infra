apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signoz
  namespace: signoz
spec:
  interval: 5m
  chart:
    spec:
      chart: signoz
      version: "0.94.1"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: flux-system
  values:
    global:
      storageClass: hcloud-volumes
    clickhouse:
      persistence:
        size: 10Gi
    signoz:
      ingress:
        enabled: true
        className: traefik
        hosts:
        - host: signoz.nokiy.net
          paths:
            - path: /
              pathType: ImplementationSpecific
              port: 8080
        tls:
        - secretName: signoz-tls
          hosts:
            - signoz.nokiy.net
    otelCollector:
      ingress:
        enabled: true
        className: traefik
        hosts:
        - host: otel.nokiy.net
          paths:
          - path: /
            pathType: ImplementationSpecific
            port: 4317
        - host: grpc.otel.nokiy.net
          paths:
          - path: /
            pathType: ImplementationSpecific
            port: 4317
        - host: http.otel.nokiy.net
          paths:
          - path: /
            pathType: ImplementationSpecific
            port: 4318
        tls:
        - secretName: otel-tls
          hosts:
            - "otel.nokiy.net"
            - "*.otel.nokiy.net"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-infra
  namespace: signoz
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s-infra
      version: "0.14.1"
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: flux-system
  values:
    global:
      cloud: others
      storageClass: local-path
      clusterName: yuzu.nokiy.net
      deploymentEnvironment: production
    otelCollectorEndpoint: signoz-otel-collector:4317
    otelInsecure: true
    apiKeyExistingSecretName: signoz-secrets
    apiKeyExistingSecretKey: api_key
    presets:
      otlpExporter:
        enabled: true
      loggingExporter:
        enabled: false
