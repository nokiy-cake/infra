apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-init
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/velero/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
    - name: hetzner-csi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-secrets
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/velero/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: velero-init
    - name: external-secrets-release
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/velero/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  patches:
    - patch: |-
        - op: add
          path: /spec/values/configuration/backupStorageLocation/0/prefix
          value: yuzu-backups
        - op: add
          path: /spec/values/configuration/volumeSnapshotLocation/0/prefix
          value: yuzu-volumes
  dependsOn:
    - name: velero-secrets
