apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: skypilot
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  path: ./common/skypilot
  prune: true
  wait: true
  dependsOn:
    - name: tailscale
    - name: external-secrets
    - name: redis-operator
