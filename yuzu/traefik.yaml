apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1m
  patches:
    - patch: |
        spec:
          values:
            deployment:
              replicas: 1
      target:
        kind: HelmRelease
        name: traefik
  path: ./common/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
