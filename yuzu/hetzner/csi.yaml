apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hetzner-csi
  namespace: flux-system
spec:
  dependsOn:
    - name: hetzner-init
  interval: 5m
  path: ./yuzu/hetzner/csi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
