apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hetzner-csi
  namespace: hetzner
spec:
  interval: 5m
  chart:
    spec:
      chart: hcloud-csi
      version: "2.18.0"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: flux-system
  values:
    hcloudToken:
      existingSecret:
        name: hetzner-secrets
        key: token
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
