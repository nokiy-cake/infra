---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: atuin
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/nokiy-cake/infra
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/atuin
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: atuin
  dependsOn:
  - name: cnpg
  - name: external-secrets-config
