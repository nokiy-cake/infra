---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: atuin
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/nokiy-cake/infra
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/atuin
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: atuin
  dependsOn:
  - name: cnpg
  - name: external-secrets
  patches:
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: atuin.nokiy.net
      - op: replace
        path: /spec/tls/0/hosts/0
        value: atuin.nokiy.net
      - op: replace
        path: /spec/tls/0/secretName
        value: atuin-tls
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: atuin.nokiy.net
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1ttl
        value: "300"
    target:
      kind: Ingress
      name: atuin
