---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-smb-init
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/csi-smb/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: smb-csi
  timeout: 5m
  wait: true
  dependsOn:
    - name: cilium
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-smb-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/csi-smb/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: smb-csi
  timeout: 5m
  wait: true
  dependsOn:
    - name: csi-smb-init
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-smb-secrets
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/csi-smb/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: smb-csi
  timeout: 5m
  wait: true
  dependsOn:
    - name: csi-smb-release
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-smb-volumes
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/csi-smb/volumes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: smb-csi
  timeout: 5m
  wait: true
  dependsOn:
    - name: csi-smb-secrets
