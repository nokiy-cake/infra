apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
    app.kubernetes.io/instance: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/instance: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
        app.kubernetes.io/instance: pocket-id
    spec:
      serviceAccountName: pocket-id
      initContainers:
        - name: litestream-restore
          image: litestream/litestream:0.5.2
          imagePullPolicy: IfNotPresent
          args:
            - restore
            - -if-db-not-exists
            - /data/pocket-id.db
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
        - name: litestream
          image: litestream/litestream:0.5.2
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - replicate
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v1.16.0-distroless
          imagePullPolicy: IfNotPresent
          ports:
            - name: pocket-id-port
              containerPort: 1411
              protocol: TCP
          env:
            - name: APP_URL
              value: "https://id.nokiy.net"
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY 
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: ENCRYPTION_KEY
            - name: ANALYTICS_DISABLED 
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
        - name: litestream-config
          secret:
            secretName: litestream-secrets
