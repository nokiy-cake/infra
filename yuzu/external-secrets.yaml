apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-init
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/external-secrets/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: k3s
    - name: cert-manager-issuer
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-op-connect-server
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-init
  interval: 1m
  path: ./common/external-secrets/1password
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/external-secrets/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-op-connect-server
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/external-secrets/config
  patches:
    - patch: |-
        # This first operation ensures the 'vaults' map exists.
        # It creates an empty map {} if the path doesn't exist.
        - op: add
          path: /spec/provider/onepassword/vaults
          value: {}
        # This second operation can now safely add the key to the map.
        - op: add
          path: /spec/provider/onepassword/vaults/yuzu.nokiy.net
          value: 1
      target:
        kind: ClusterSecretStore
        name: production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-release
