apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: k3s
  interval: 1m
  path: ./common/external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-release
    - name: external-secrets
  interval: 1m
  path: ./common/external-secrets/config
  patches:
    - patch: |
        spec:
          provider:
            onepassword:
              vaults:
                yuzu.nokiy.net: 1
      target:
        kind: ClusterSecretStore
        name: production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
