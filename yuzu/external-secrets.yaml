apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/external-secrets
  patches:
    - patch: |
        spec:
          provider:
            onepassword:
              vaults:
                yuzu.nokiy.net: 1
      target:
        kind: ClusterSecretStore
        name: production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
