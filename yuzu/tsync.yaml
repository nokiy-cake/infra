apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tsync
  namespace: flux-system
spec:
  interval: 1m
  path: ./common/tsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-op-connect-server
    - name: external-secrets-config
