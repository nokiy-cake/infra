apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: production
spec:
  provider:
    onepassword:
      connectHost: https://onepassword-connect:8080
      vaults:
        yuzu.nokiy.net: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-token
            key: token
