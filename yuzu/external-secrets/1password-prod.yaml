apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: production
spec:
  provider:
    onepassword:
      connectHost: https://onepassword-connect-prod:8080
      vaults:
        yuzu.nokiy.net: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token-prod
            key: token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-connect-prod
spec:
  template:
    spec:
      containers:
      - name: connect-api
        image: 1password/connect-api:1.5.0
        env:
        - name: OP_SESSION
          valueFrom:
            secretKeyRef:
              name: connect-server-credentials
              key: 1password-credentials.json
      - name: connect-sync
        image: 1password/connect-sync:1.5.0
        env:
        - name: OP_SESSION
          valueFrom:
            secretKeyRef:
              name: connect-server-credentials
              key: 1password-credentials.json
