apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-public
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: traefik-public-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vault.nokiy.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
  tls:
  - hosts:
    - "vault.nokiy.net"
    secretName: vaultwarden-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-tailscale
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: tailscale-traefik-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vault.i.nokiy.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
  tls:
  - hosts:
    - "vault.i.nokiy.net"
    secretName: vaultwarden-internal-tls
