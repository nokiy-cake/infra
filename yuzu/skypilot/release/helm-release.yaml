apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: skypilot
  namespace: skypilot
spec:
  interval: 5m
  chart:
    spec:
      chart: skypilot
      version: "0.10.3"
      sourceRef:
        kind: HelmRepository
        name: skypilot
        namespace: flux-system
  values:
    storage:
      enabled: true
      storageClass: local-path
      size: 5Gi
    ingress:
      enabled: true
      host: skypilot.nokiy.net
      ingressClassName: tailscale
      annotations:
        

    ingress-nginx:
      enabled: false
