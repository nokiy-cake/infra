apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: b2-creds
  namespace: postgres
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: b2-creds
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
  data:
    - secretKey: access_key
      remoteRef:
        key: b2-backup
        property: ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: b2-backup
        property: SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-nokiy-creds
  namespace: postgres
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: postgres-nokiy-creds
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        username: nokiy
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: nokiy
        property: POSTGRES_PASSWORD
---
