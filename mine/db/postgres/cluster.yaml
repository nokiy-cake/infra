apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 3
  enableSuperuserAccess: true
  storage:
    size: 20Gi
    storageClass: local-path
  walStorage:
    size: 10Gi
    storageClass: local-path
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: postgres-authentik-creds
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: postgres-forgejo-creds
      - name: synapse
        ensure: present
        login: true
        passwordSecret:
          name: postgres-synapse-creds
      - name: mas
        ensure: present
        login: true
        passwordSecret:
          name: postgres-mas-creds
      - name: nokiy
        ensure: present
        login: true
        passwordSecret:
          name: postgres-nokiy-creds
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: postgres-linkding-creds
      - name: miniflux
        ensure: present
        login: true
        passwordSecret:
          name: postgres-miniflux-creds
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://backup-nokiy-net/mine/postgres/
      endpointURL: https://s3.us-east-005.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: b2-creds
          key: access_key
        secretAccessKey:
          name: b2-creds
          key: secret_key
      wal:
        compression: bzip2
        maxParallel: 8
        encryption: AES256
      data:
        compression: bzip2
        encryption: AES256
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-backup
  namespace: postgres
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
---
