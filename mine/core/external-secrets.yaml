apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-init
  namespace: flux-system
spec:
  interval: 1h
  path: ./common/external-secrets/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: cert-manager-issuer
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-op-connect-server
  namespace: flux-system
spec:
  interval: 1h
  path: ./common/external-secrets/1password
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-init
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-release
  namespace: flux-system
spec:
  interval: 1h
  path: ./common/external-secrets/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-op-connect-server
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 1h
  path: ./common/external-secrets/config
  patches:
    - patch: |-
        - op: add
          path: /spec/provider/onepassword/vaults
          value: {}
        - op: add
          path: /spec/provider/onepassword/vaults/mine.nokiy.net
          value: 1
      target:
        kind: ClusterSecretStore
        name: production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-release
