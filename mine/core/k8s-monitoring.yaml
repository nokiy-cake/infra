apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-monitoring
  namespace: flux-system
spec:
  interval: 2m
  path: ./common/k8s-monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: external-secrets-config
  postBuild:
    substitute:
      CLUSTER_NAME: mine
