apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-tailscale
  namespace: flux-system
spec:
  interval: 10m
  path: ./common/traefik-tailscale
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: tailscale-release
  postBuild:
    substitute:
      CLUSTER: mine
