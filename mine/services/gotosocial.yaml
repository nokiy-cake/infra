---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial-init
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/gotosocial/init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/gotosocial/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: gotosocial-init
    - name: external-secrets-release
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial-release
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/gotosocial/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: gotosocial-secrets
    - name: local-path-provisioner
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial-config
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/gotosocial/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: gotosocial-release
    - name: traefik
    - name: cert-manager-letsencrypt
    - name: external-dns-release
  patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gotosocial
        namespace: gotosocial
        annotations:
          external-dns.alpha.kubernetes.io/hostname: social.nokiy.net
          external-dns.alpha.kubernetes.io/ttl: "300"
    target:
      kind: Ingress
      name: gotosocial
      namespace: gotosocial
