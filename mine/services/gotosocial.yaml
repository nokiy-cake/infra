---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/gotosocial
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: traefik
    - name: external-secrets-config
    - name: cert-manager-letsencrypt
    - name: external-dns-release
  patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gotosocial
        namespace: gotosocial
        annotations:
          external-dns.alpha.kubernetes.io/hostname: social.nokiy.net
          external-dns.alpha.kubernetes.io/ttl: "300"
    target:
      kind: Ingress
      name: gotosocial
      namespace: gotosocial
