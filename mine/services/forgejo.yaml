---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-init
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/forgejo/init-shared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: cnpg
    - name: redis-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/forgejo/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: forgejo-init
    - name: external-secrets-release
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-release
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/forgejo/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: forgejo-secrets
  patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: forgejo
        namespace: forgejo
      spec:
        template:
          spec:
            containers:
            - name: forgejo
              env:
              - name: FORGEJO__database__HOST
                value: postgres-rw.postgres.svc.cluster.local:5432
    target:
      kind: Deployment
      name: forgejo
      namespace: forgejo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-config
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/forgejo/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: forgejo-release
    - name: traefik
    - name: cert-manager-letsencrypt
    - name: external-dns-release
  patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: forgejo
        namespace: forgejo
        annotations:
          external-dns.alpha.kubernetes.io/hostname: git.nokiy.net
          external-dns.alpha.kubernetes.io/ttl: "300"
    target:
      kind: Ingress
      name: forgejo
      namespace: forgejo
