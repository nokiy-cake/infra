apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notion-sync
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/notion-sync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: nokiy-net
