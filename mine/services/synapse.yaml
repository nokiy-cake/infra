---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synapse-init
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/synapse/init-shared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: cnpg
    - name: redis-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synapse-secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/synapse/secrets-shared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: synapse-init
    - name: external-secrets-release
    - name: external-secrets-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synapse-config
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/synapse/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  dependsOn:
    - name: synapse-init
    - name: traefik
    - name: cert-manager-letsencrypt
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synapse-release
  namespace: flux-system
spec:
  interval: 5m
  path: ./common/synapse/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: synapse-secrets
    - name: synapse-config
