apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-secrets
  namespace: skypilot
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: aws-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        credentials: |
          [tigris]
          aws_access_key_id={{ .tigris_client_id }}
          aws_secret_access_key={{ .tigris_client_secret }}
        config: |
          [profile tigris]
          region = auto
          services = tigris-s3

          [services tigris-s3]
          s3 =
            endpoint_url = https://t3.storage.dev

  data:
    - secretKey: tigris_client_id
      remoteRef:
        key: skypilot
        property: TIGRIS_CLIENT_ID
    - secretKey: tigris_client_secret
      remoteRef:
        key: skypilot
        property: TIGRIS_CLIENT_SECRET
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: skypilot
  namespace: skypilot
spec:
  interval: 1h
  chart:
    spec:
      chart: skypilot-nightly
      version: "1.0.0-dev.20260125"
      sourceRef:
        kind: HelmRepository
        name: skypilot
        namespace: flux-system
  values:
    rbac:
      manageSystemComponents: false
    apiService:
      dbConnectionSecretName: skypilot-postgres-secrets
      skipResourceCheck: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
      extraVolumes:
        - name: aws-config
          secret:
            secretName: aws-secrets
            items:
              - key: config
                path: config
      extraVolumeMounts:
        - name: aws-config
          mountPath: /root/.aws/config
          subPath: config
          readOnly: true
      extraEnvs:
        - name: AWS_SDK_LOAD_CONFIG
          value: "1"
        - name: AWS_PROFILE
          value: "tigris"
    auth:
      oauth:
        enabled: true
        oidc-issuer-url: https://id.nokiy.net
        client-details-from-secret: "skypilot-secrets"
        session-store-type: redis
        redis-url: redis://valkey-skypilot:6379
    storage:
      enabled: true
      storageClassName: local-path
      accessMode: ReadWriteOnce
      size: 10Gi
    ingress:
      enabled: true
      host: sky.nokiy.net
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/hostname: sky.nokiy.net
      tls:
        enabled: true
    ingress-nginx:
      enabled: false
    awsCredentials:
      enabled: true
      awsSecretName: aws-secrets
      useCredentialsFile: true
    kubernetesCredentials:
      useApiServerCluster: false
    vastCredentials:
      enabled: true
      vastSecretName: vastai-secrets
    runpodCredentials:
      enabled: true
      runpodSecretName: runpod-secrets
