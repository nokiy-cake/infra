apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skypilot-secrets
  namespace: skypilot
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: skypilot-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        client-id: "{{ .CLIENT_ID }}"
        client-secret: "{{ .CLIENT_SECRET }}"
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: skypilot
        property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: skypilot
        property: CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skypilot-postgres-secrets
  namespace: skypilot
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: skypilot-postgres-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        connection_string: postgresql://skypilot:{{ .POSTGRES_PASSWORD }}@pooler-rw.postgres.svc.cluster.local:5432/skypilot
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: skypilot
        property: POSTGRES_PASSWORD
---
