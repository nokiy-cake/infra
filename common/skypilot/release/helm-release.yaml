apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skypilot-secrets
  namespace: skypilot
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: skypilot-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        CLIENT_ID: "{{ .CLIENT_ID }}"
        CLIENT_SECRET: "{{ .CLIENT_SECRET }}"
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: skypilot
        property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: skypilot
        property: CLIENT_SECRET
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: skypilot-redis
  namespace: skypilot
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.2.2
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.79.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: skypilot
  namespace: skypilot
spec:
  interval: 1h
  chart:
    spec:
      chart: skypilot
      version: "0.10.5"
      sourceRef:
        kind: HelmRepository
        name: skypilot
        namespace: flux-system
  values:
    apiService:
      skipResourceCheck: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    oauth:
      enabled: true
      oidc-issuer-url: https://id.nokiy.net
      # client-id: skypilot-xxxxxx.apps.googleusercontent.com
      # client-secret: skypilot-xxxxxx.apps.googleusercontent.com
      session-store-type: redis
      redis-url: redis://skypilot-redis:6379
    storage:
      enabled: false
    ingress:
      enabled: true
      host: sky.nokiy.net
      ingressClassName: traefik
    ingress-nginx:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: skypilot-secrets
      valuesKey: CLIENT_ID
      targetPath: oauth.client-id
    - kind: Secret
      name: skypilot-secrets
      valuesKey: CLIENT_SECRET
      targetPath: oauth.client-secret
