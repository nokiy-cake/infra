apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: usesend-redis
  namespace: usesend
spec:
  kubernetesConfig:
    image: redis:7
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    redisSecret:
      name: usesend-redis-secret
      key: password
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
  redisExporter:
    enabled: false
  redisConfig:
    additionalRedisConfig: |
      maxmemory-policy noeviction
