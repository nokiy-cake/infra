apiVersion: apps/v1
kind: Deployment
metadata:
  name: usesend
  namespace: usesend
  labels:
    app.kubernetes.io/name: usesend
    app.kubernetes.io/instance: usesend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: usesend
      app.kubernetes.io/instance: usesend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usesend
        app.kubernetes.io/instance: usesend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z usesend-db-rw 5432; do echo waiting for db; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z usesend-redis 6379; do echo waiting for redis; sleep 2; done;']
      containers:
      - name: usesend
        image: usesend/usesend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          value: "postgresql://usesend:$(POSTGRES_PASSWORD)@usesend-db-rw:5432/usesend"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: usesend-db-credentials
              key: password
        - name: NEXTAUTH_URL
          value: "https://usesend.example.com"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: nextauth-secret
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: aws-access-key
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: aws-secret-key
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: aws-region
        - name: AWS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: aws-endpoint
        - name: AWS_BUCKET
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: aws-bucket
        - name: GITHUB_ID
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: github-id
        - name: GITHUB_SECRET
          valueFrom:
            secretKeyRef:
              name: usesend-app-secrets
              key: github-secret
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@usesend-redis:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: usesend-redis-secret
              key: password
        - name: NEXT_PUBLIC_IS_CLOUD
          value: "false"
        - name: API_RATE_LIMIT
          value: "1"
        - name: SMTP_HOST
          value: "smtp.usesend.com"
        - name: SMTP_USER
          value: "usesend"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
