---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-user-reonokiy-write
  namespace: vm
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: vm-user-reonokiy-write
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        token: "{{ .token | toString }}"
  data:
    - secretKey: token
      remoteRef:
        key: vm-user-reonokiy-write
        property: TOKEN
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: reonokiy-write
  namespace: vm
  labels:
    vmauth: main
spec:
  tokenRef:
    name: vm-user-reonokiy-write
    key: token

  targetRefs:
    - crd:
        kind: VMCluster/vminsert
        name: vm
        namespace: vm
      target_path_suffix: "/insert/0/prometheus"
      paths:
        - "/api/v1/write"

    - crd:
        kind: VLCluster/vlinsert
        name: vl
        namespace: vm
      paths:
        - "/insert/.*"
