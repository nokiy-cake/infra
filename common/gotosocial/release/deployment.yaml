---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotosocial
  namespace: gotosocial
  labels:
    app.kubernetes.io/name: gotosocial
    app.kubernetes.io/instance: gotosocial
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gotosocial
      app.kubernetes.io/instance: gotosocial
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotosocial
        app.kubernetes.io/instance: gotosocial
    spec:
      initContainers:
        # Restore database from S3 backup if it doesn't exist
        - name: litestream-restore
          image: litestream/litestream:0.5.0
          imagePullPolicy: IfNotPresent
          args:
            - restore
            - -if-db-not-exists
            - /gotosocial/storage/sqlite.db
          volumeMounts:
            - name: data
              mountPath: /gotosocial/storage
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 1000m
              memory: 512Mi

        # Continuous replication to S3
        - name: litestream
          image: litestream/litestream:0.5.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - replicate
          volumeMounts:
            - name: data
              mountPath: /gotosocial/storage
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 1000m
              memory: 512Mi

      containers:
        - name: gotosocial
          image: superseriousbusiness/gotosocial:0.20.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gotosocial-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /gotosocial/storage
            - name: cache
              mountPath: /gotosocial/.cache
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1200  # 1200 * 10s = 200 minutes for startup/migrations
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gotosocial-data
        - name: cache
          emptyDir: {}
        - name: litestream-config
          secret:
            secretName: litestream-secrets
