---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotosocial-secrets
  namespace: gotosocial
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: gotosocial-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: gotosocial
          app.kubernetes.io/part-of: gotosocial
      data:
        GTS_HOST: '{{ .GTS_HOST | toString }}'
        GTS_TRUSTED_PROXIES: "10.0.0.0/8,192.168.0.0/16"
        GTS_INSTANCE_LANGUAGE: en
        GTS_DB_TYPE: sqlite
        GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
        GTS_OIDC_ENABLED: "true"
        GTS_OIDC_ISSUER: '{{ .GTS_OIDC_ISSUER | toString }}'
        GTS_OIDC_IDP_NAME: '{{ .GTS_OIDC_IDP_NAME | toString }}'
        GTS_OIDC_LINK_EXISTING: "true"
        GTS_OIDC_ALLOWED_GROUPS: '{{ .GTS_OIDC_ALLOWED_GROUPS | toString }}'
        GTS_OIDC_ADMIN_GROUPS: '{{ .GTS_OIDC_ADMIN_GROUPS | toString }}'
        GTS_OIDC_CLIENT_ID: '{{ .GTS_OIDC_CLIENT_ID | toString }}'
        GTS_OIDC_CLIENT_SECRET: '{{ .GTS_OIDC_CLIENT_SECRET | toString }}'
        GTS_STORAGE_BACKEND: s3
        GTS_STORAGE_S3_PROXY: "false"
        GTS_STORAGE_S3_BUCKET: '{{ .GTS_STORAGE_S3_BUCKET | toString }}'
        GTS_STORAGE_S3_ENDPOINT: '{{ .GTS_STORAGE_S3_ENDPOINT | toString }}'
        GTS_STORAGE_S3_ACCESS_KEY: '{{ .GTS_STORAGE_S3_ACCESS_KEY | toString }}'
        GTS_STORAGE_S3_SECRET_KEY: '{{ .GTS_STORAGE_S3_SECRET_KEY | toString }}'
        GTS_STORAGE_S3_USE_SSL: "true"
        GTS_STORAGE_LOCAL_BASE_PATH: /gotosocial/storage
        GTS_WAZERO_COMPILATION_CACHE: /gotosocial/.cache
        GTS_HTTP_PORT: "8080"
  data:
    - secretKey: GTS_HOST
      remoteRef:
        key: gotosocial
        property: GTS_HOST
    - secretKey: GTS_OIDC_ISSUER
      remoteRef:
        key: gotosocial
        property: OIDC_ISSUER
    - secretKey: GTS_OIDC_IDP_NAME
      remoteRef:
        key: gotosocial
        property: OIDC_IDP_NAME
    - secretKey: GTS_OIDC_ALLOWED_GROUPS
      remoteRef:
        key: gotosocial
        property: OIDC_ALLOWED_GROUPS
    - secretKey: GTS_OIDC_ADMIN_GROUPS
      remoteRef:
        key: gotosocial
        property: OIDC_ADMIN_GROUPS
    - secretKey: GTS_OIDC_CLIENT_ID
      remoteRef:
        key: gotosocial
        property: OIDC_CLIENT_ID
    - secretKey: GTS_OIDC_CLIENT_SECRET
      remoteRef:
        key: gotosocial
        property: OIDC_CLIENT_SECRET
    - secretKey: GTS_STORAGE_S3_BUCKET
      remoteRef:
        key: gotosocial
        property: STORAGE_S3_BUCKET
    - secretKey: GTS_STORAGE_S3_ENDPOINT
      remoteRef:
        key: gotosocial
        property: STORAGE_S3_ENDPOINT
    - secretKey: GTS_STORAGE_S3_ACCESS_KEY
      remoteRef:
        key: gotosocial
        property: STORAGE_S3_ACCESS_KEY
    - secretKey: GTS_STORAGE_S3_SECRET_KEY
      remoteRef:
        key: gotosocial
        property: STORAGE_S3_SECRET_KEY
