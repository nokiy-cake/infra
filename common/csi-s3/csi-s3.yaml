apiVersion: v1
kind: Namespace
metadata:
  name: csi-s3
  labels:
    nokiy.net/cluster-secret-store: "production"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: yandex-s3
  namespace: flux-system
spec:
  interval: 12h
  url: https://yandex-cloud.github.io/k8s-csi-s3/charts
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-s3-credentials
  namespace: csi-s3
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: csi-s3-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        accessKeyID: "{{ .ACCESS_KEY_ID }}"
        secretAccessKey: "{{ .SECRET_ACCESS_KEY }}"
        endpoint: "https://s3.us-east-005.backblazeb2.com"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: b2-csi
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: b2-csi
        property: SECRET_KEY
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-s3
  namespace: csi-s3
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-s3
      version: "0.43.2"
      sourceRef:
        kind: HelmRepository
        name: yandex-s3
        namespace: flux-system
  values:
    secret:
      create: false
      name: csi-s3-secret
    storageClass:
      name: b2-csi
      singleBucket: "csi-nokiy-net"
      mounter: geesefs
      mountOptions: "--memory-limit 1000 --dir-mode 0777 --file-mode 0666"
      reclaimPolicy: Retain
    kubeletPath: /var/lib/rancher/rke2/bin/kubelet
