apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h
  chart:
    spec:
      chart: velero
      version: "11.3.2"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  values:
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: backup
          # prefix: yuzu-backups # patch in cluster specific
          default: true
          config:
            region: auto
            s3Url: nokiy.net
            s3ForcePathStyle: false
          credential:
            name: velero-s3-credentials
            key: config.toml
      volumeSnapshotLocation:
        - name: default
          provider: aws
          bucket: backup
          # prefix: yuzu-volumes # patch in cluster specific
          config:
            region: auto
            s3Url: nokiy.net
            s3ForcePathStyle: false
          credential:
            name: velero-s3-credentials
            key: config.toml
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
