apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-distributed
  namespace: lgtm
spec:
  interval: 5m
  chart:
    spec:
      chart: lgtm-distributed
      version: '2.1.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Grafana configuration
    grafana:
      enabled: true
      persistence:
        enabled: true
        type: pvc
        size: 1Gi
        accessModes:
          - ReadWriteOnce
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.nokiy.net
          - grafana.yuzu.nokiy.net
        path: /
        pathType: Prefix
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.nokiy.net
              - grafana.yuzu.nokiy.net

    # Loki configuration
    loki:
      enabled: true

    # Mimir configuration
    mimir:
      enabled: true

    # Tempo configuration
    tempo:
      enabled: true

    # Grafana OnCall configuration - disabled due to naming length issues
    # The job name "lgtm-distributed-grafana-oncall-engine-migrate-*" exceeds 63 chars
    # Can be enabled later with a shorter release name or custom nameOverride
    grafana-oncall:
      enabled: false
