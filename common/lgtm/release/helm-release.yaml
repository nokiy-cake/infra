apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-distributed
  namespace: lgtm
spec:
  interval: 5m
  chart:
    spec:
      chart: lgtm-distributed
      version: '2.1.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: true
    loki:
      enabled: true
    mimir:
      enabled: true
    tempo:
      enabled: true
    grafana-oncall:
      enabled: true
      grafana:
        enabled: false
      externalGrafana:
        url: http://lgtm-distributed-grafana.lgtm.svc.cluster.local
