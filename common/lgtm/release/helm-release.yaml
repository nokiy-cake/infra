apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-distributed
  namespace: lgtm
spec:
  interval: 5m
  chart:
    spec:
      chart: lgtm-distributed
      version: '2.1.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Disable nginx gateway, use Traefik ingress instead
    gateway:
      enabled: false

    # Configure Traefik ingress for Mimir endpoints
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - mimir.yuzu.nokiy.net
        - mimir.nokiy.net
      tls:
        - secretName: mimir-tls
          hosts:
            - mimir.yuzu.nokiy.net
            - mimir.nokiy.net

    # Grafana configuration
    grafana:
      enabled: true
      persistence:
        enabled: true
        type: pvc
        size: 1Gi
        accessModes:
          - ReadWriteOnce
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.nokiy.net
          - grafana.yuzu.nokiy.net
        path: /
        pathType: Prefix
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.nokiy.net
              - grafana.yuzu.nokiy.net

    # Loki configuration
    loki:
      enabled: true
      loki:
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem

    # Mimir configuration with filesystem backend for dev/staging
    mimir:
      enabled: true
      mimir:
        structuredConfig:
          common:
            storage:
              backend: filesystem

    # Tempo configuration
    tempo:
      enabled: true

    # Grafana OnCall configuration
    grafana-oncall:
      enabled: true
      grafana:
        enabled: false
      externalGrafana:
        url: http://lgtm-distributed-grafana.lgtm.svc.cluster.local
      mariadb:
        image:
          repository: bitnami/mariadb
          tag: latest
        primary:
          persistence:
            enabled: true
            size: 1Gi
