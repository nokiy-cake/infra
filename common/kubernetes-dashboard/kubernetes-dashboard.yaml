apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-dashboard
  labels:
    name: kubernetes-dashboard
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubernetes-dashboard
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes.github.io/dashboard/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
spec:
  interval: 5m
  chart:
    spec:
      chart: kubernetes-dashboard
      version: "7.14.0"
      sourceRef:
        kind: HelmRepository
        name: kubernetes-dashboard
        namespace: flux-system
  values:
    app:
      ingress:
        enabled: true
        ingressClassName: tailscale-traefik
        useDefaultAnnotations: false
        path: /
        pathType: Prefix
        hosts:
          - dashboard.mine.i.nokiy.net
        issuer:
          name: letsencrypt-prod
          scope: cluster
        tls:
          enabled: true
          secretName: wildcard-mine-i-nokiy-net-tls
        annotations:
          external-dns.alpha.kubernetes.io/hostname: dashboard.mine.i.nokiy.net
    protocolHttp: true
    metricsScraper:
      enabled: true
