apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakefs-secrets
  namespace: lakefs
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: lakefs-secrets
    template:
      engineVersion: v2
      data:
        auth_encrypt_secret_key: "{{ .auth_encrypt_secret_key }}"
        s3_access_key: "{{ .s3_access_key }}"
        s3_secret_key: "{{ .s3_secret_key }}"
        postgres_password: "{{ .postgres_password }}"
        database_connection_string: "postgres://lakefs:{{ .postgres_password }}@pooler-rw.postgres.svc.cluster.local:5432/lakefs"
  data:
    - secretKey: auth_encrypt_secret_key
      remoteRef:
        key: lakefs
        property: AUTH_ENCRYPT_SECRET_KEY
    - secretKey: s3_access_key
      remoteRef:
        key: lakefs
        property: ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: lakefs
        property: SECRET_KEY
    - secretKey: postgres_password
      remoteRef:
        key: lakefs
        property: POSTGRES_PASSWORD
