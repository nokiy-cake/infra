apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/instance: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:13.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: pooler-rw.postgres.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-credentials
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-credentials
                  key: password
            - name: FORGEJO__cache__ADAPTER
              value: redis
            - name: FORGEJO__cache__HOST
              value: redis://valkey-forgejo.forgejo.svc.cluster.local:6379
            - name: FORGEJO__server__PROTOCOL
              value: http
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"
            - name: FORGEJO__cron__ENABLED
              value: "true"
            - name: FORGEJO__cron__RUN_AT_START
              value: "true"
            - name: FORGEJO__cron__NOTICE_ON_SUCCESS
              value: "true"
            - name: FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            - name: FORGEJO__service__SHOW_REGISTRATION_BUTTON
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            - name: FORGEJO__indexer__REPO_INDEXER_ENABLED
              value: "true"
            - name: FORGEJO__queue__TYPE
              value: redis
            - name: FORGEJO__queue__CONN_STR
              value: redis://valkey-forgejo.forgejo.svc.cluster.local:6379
            - name: FORGEJO__session__PROVIDER
              value: redis
            - name: FORGEJO__session__PROVIDER_CONFIG
              value: redis://valkey-forgejo.forgejo.svc.cluster.local:6379
            - name: FORGEJO__session__COOKIE_SECURE
              value: "true"
            - name: FORGEJO__session__COOKIE_NAME
              value: forgejo_session
            - name: FORGEJO__repository__ENABLE_PUSH_CREATE_USER
              value: "true"
            - name: FORGEJO__repository__ENABLE_PUSH_CREATE_ORG
              value: "true"
          envFrom:
            - secretRef:
                name: forgejo-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
