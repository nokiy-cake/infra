apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-public
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: git.nokiy.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
  tls:
  - hosts:
    - "git.nokiy.net"
    secretName: forgejo-tls
