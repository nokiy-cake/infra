apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-secrets
  namespace: mlflow
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: mlflow-secrets
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "mlflow"
        POSTGRES_PASSWORD: "{{ .password }}"
        AUTH_POSTGRES_USER: "mlflow-auth"
        AUTH_POSTGRES_PASSWORD: "{{ .auth_password }}"
        S3_ACCESS_KEY: "{{ .s3_access_key }}"
        S3_SECRET_KEY: "{{ .s3_secret_key }}"
        ADMIN_USERNAME: "admin"
        ADMIN_PASSWORD: "{{ .admin_password }}"

  data:
    - secretKey: password
      remoteRef:
        key: mlflow
        property: POSTGRES_PASSWORD
    - secretKey: auth_password
      remoteRef:
        key: mlflow
        property: AUTH_POSTGRES_PASSWORD
    - secretKey: s3_access_key
      remoteRef:
        key: mlflow
        property: ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: mlflow
        property: SECRET_KEY
    - secretKey: admin_password
      remoteRef:
        key: mlflow
        property: ADMIN_PASSWORD
