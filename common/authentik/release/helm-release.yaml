---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: "2025.8.4"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
  - kind: Secret
    name: authentik-secrets
    valuesKey: SECRET_KEY
    targetPath: authentik.secret_key
  - kind: Secret
    name: postgres-authentik
    valuesKey: username
    targetPath: authentik.postgresql.user
  - kind: Secret
    name: postgres-authentik
    valuesKey: password
    targetPath: authentik.postgresql.password
  values:
    authentik:
      error_reporting:
        enabled: true
      postgresql:
        host: postgres-rw.authentik.svc.cluster.local
        port: 5432
        name: authentik
      redis:
        host: redis.authentik.svc.cluster.local
        port: 6379

    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
        - auth.nokiy.net
        tls:
        - secretName: authentik-tls
          hosts:
          - auth.nokiy.net

    postgresql:
      enabled: false

    redis:
      enabled: false
