apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-secrets
  namespace: atuin
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: atuin-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        password: "{{ .POSTGRES_PASSWORD }}"
        db_uri: "postgres://atuin:{{ .POSTGRES_PASSWORD }}@atuin-rw.atuin.svc.cluster.local:5432/atuin"
        server.toml: |
          host = "0.0.0.0"
          port = 8888
          open_registration = true
          db_uri = "postgres://atuin:{{ .POSTGRES_PASSWORD }}@atuin-rw.atuin.svc.cluster.local:5432/atuin"
          
          [tls]
          enable = false
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: atuin
      property: POSTGRES_PASSWORD
