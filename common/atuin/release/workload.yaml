---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: atuin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atuin
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atuin
        app.kubernetes.io/component: server
    spec:
      containers:
      - name: atuin
        image: ghcr.io/atuinsh/atuin:18.3.0
        imagePullPolicy: IfNotPresent
        args:
        - server
        - start
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: server-config
          mountPath: /root/.config/atuin
        - name: tls
          mountPath: /etc/atuin/tls
          readOnly: true
      volumes:
      - name: server-config
        secret:
          secretName: atuin-secrets
          items:
          - key: server.toml
            path: server.toml
      - name: tls
        secret:
          secretName: atuin-tls-cert
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: atuin
  namespace: atuin
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8888
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: server
