---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: atuin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atuin
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atuin
        app.kubernetes.io/component: server
    spec:
      containers:
      - name: atuin
        image: ghcr.io/atuinsh/atuin:18.16.1
        imagePullPolicy: IfNotPresent
        args:
        - server
        - start
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        env:
        - name: ATUIN_PORT
          value: "8888"
        - name: ATUIN_HOST
          value: "0.0.0.0"
        - name: ATUIN_OPEN_REGISTRATION
          value: "true"
        - name: ATUIN_DB_URI
          valueFrom:
            secretKeyRef:
              name: atuin-secrets
              key: db_uri
        - name: ATUIN_TLS__ENABLE
          value: "false"
        - name: ATUIN_TLS__CERT
          valueFrom:
            secretKeyRef:
              name: atuin-tls-cert
              key: tls.crt
        - name: ATUIN_TLS__PKEY
          valueFrom:
            secretKeyRef:
              name: atuin-tls-cert
              key: tls.key
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atuin
  namespace: atuin
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8888
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: server
