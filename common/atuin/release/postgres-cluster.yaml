---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atuin
  namespace: atuin
spec:
  instances: 1
  storage:
    size: 1Gi
  managed:
    roles:
    - name: atuin
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: atuin-secrets
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: atuin-db
  namespace: atuin
spec:
  name: atuin
  owner: atuin
  cluster:
    name: atuin

