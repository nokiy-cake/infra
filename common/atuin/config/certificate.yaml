apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: atuin-tls
  namespace: atuin
spec:
  secretName: atuin-tls
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  commonName: atuin.atuin.svc.cluster.local
  dnsNames:
  - atuin
  - atuin.atuin
  - atuin.atuin.svc
  - atuin.atuin.svc.cluster.local
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: atuin
spec:
  selfSigned: {}
