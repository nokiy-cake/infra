---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nofx-data
  namespace: nofx
  labels:
    app.kubernetes.io/name: nofx
    app.kubernetes.io/instance: nofx
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: nofx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
