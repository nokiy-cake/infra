---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nofx-frontend
  namespace: nofx
  labels:
    app.kubernetes.io/name: nofx
    app.kubernetes.io/instance: nofx
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nofx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/instance: nofx
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: nofx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nofx
        app.kubernetes.io/instance: nofx
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: nofx
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nofxaios/nofx-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nofx-frontend-nginx
