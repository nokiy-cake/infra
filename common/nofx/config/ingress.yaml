---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nofx
  namespace: nofx
  labels:
    app.kubernetes.io/name: nofx
    app.kubernetes.io/instance: nofx
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nofx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: nofx-nofx-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nofx.nokiy.net
      secretName: nofx-tls
  rules:
    - host: nofx.nokiy.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nofx-frontend
                port:
                  name: http
