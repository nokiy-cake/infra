---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nofx-config
  namespace: nofx
  labels:
    app.kubernetes.io/name: nofx
    app.kubernetes.io/instance: nofx
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nofx
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: nofx-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: nofx
          app.kubernetes.io/instance: nofx
          app.kubernetes.io/component: backend
          app.kubernetes.io/part-of: nofx
      data:
        config.json: '{{ .CONFIG_JSON | toString }}'
  data:
    - secretKey: CONFIG_JSON
      remoteRef:
        key: nofx
        property: CONFIG_JSON
