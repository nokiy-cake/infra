apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sub2api-secrets
  namespace: sub2api
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: sub2api-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            host: "0.0.0.0"
            port: 8080
            mode: "release"
            frontend_url: "https://ai-gateway.nokiy.net"
            trusted_proxies: []
            max_request_body_size: 268435456
            h2c:
              enabled: true
              max_concurrent_streams: 50
              idle_timeout: 75
              max_read_frame_size: 1048576
              max_upload_buffer_per_connection: 2097152
              max_upload_buffer_per_stream: 524288

          run_mode: "simple"

          cors:
            allowed_origins: []
            allow_credentials: true

          security:
            url_allowlist:
              enabled: false
              upstream_hosts:
                - "api.openai.com"
                - "api.anthropic.com"
                - "generativelanguage.googleapis.com"
                - "cloudcode-pa.googleapis.com"
              pricing_hosts:
                - "raw.githubusercontent.com"
              crs_hosts: []
              allow_private_hosts: false
              allow_insecure_http: false

          log:
            level: "info"
            format: "json"
            service_name: "sub2api"
            env: "production"
            caller: true
            stacktrace_level: "error"
            output:
              to_stdout: true
              to_file: false
              file_path: ""

          database:
            host: "pooler-rw.postgres.svc.cluster.local"
            port: 5432
            user: "sub2api"
            password: "{{ .postgres_password }}"
            dbname: "sub2api"
            sslmode: "disable"
            max_open_conns: 50
            max_idle_conns: 10
            conn_max_lifetime_minutes: 30
            conn_max_idle_time_minutes: 5

          redis:
            host: "valkey-sub2api.sub2api.svc.cluster.local"
            port: 6379
            password: ""
            db: 0
            pool_size: 256
            min_idle_conns: 10
            enable_tls: false

          ops:
            enabled: true

          jwt:
            secret: "{{ .jwt_secret }}"
            expire_hour: 24
            access_token_expire_minutes: 0

          totp:
            encryption_key: "{{ .totp_encryption_key }}"

          linuxdo_connect:
            enabled: false

          oidc_connect:
            enabled: true
            provider_name: "NOKIY ID"
            client_id: "{{ .oidc_client_id }}"
            client_secret: "{{ .oidc_client_secret }}"
            issuer_url: "https://id.nokiy.net"
            discovery_url: "https://id.nokiy.net/.well-known/openid-configuration"
            authorize_url: ""
            token_url: ""
            userinfo_url: ""
            jwks_url: ""
            scopes: "openid email profile"
            redirect_url: "https://ai-gateway.nokiy.net/api/v1/auth/oauth/oidc/callback"
            frontend_redirect_url: "/auth/oidc/callback"
            token_auth_method: "client_secret_post"
            use_pkce: false
            validate_id_token: true
            allowed_signing_algs: "RS256,ES256,PS256"
            clock_skew_seconds: 120
            require_email_verified: false
            userinfo_email_path: ""
            userinfo_id_path: ""
            userinfo_username_path: ""

          default:
            admin_email: "{{ .admin_email }}"
            admin_password: "{{ .admin_password }}"
            user_concurrency: 5
            user_balance: 0
            api_key_prefix: "sk-"
            rate_multiplier: 1.0

          update:
            proxy_url: ""
  data:
    - secretKey: postgres_password
      remoteRef:
        key: sub2api
        property: POSTGRES_PASSWORD
    - secretKey: admin_email
      remoteRef:
        key: sub2api
        property: ADMIN_EMAIL
    - secretKey: admin_password
      remoteRef:
        key: sub2api
        property: ADMIN_PASSWORD
    - secretKey: jwt_secret
      remoteRef:
        key: sub2api
        property: JWT_SECRET
    - secretKey: totp_encryption_key
      remoteRef:
        key: sub2api
        property: TOTP_ENCRYPTION_KEY
    - secretKey: oidc_client_id
      remoteRef:
        key: sub2api
        property: OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: sub2api
        property: OIDC_CLIENT_SECRET
