apiVersion: apps/v1
kind: Deployment
metadata:
  name: notion-sync
  namespace: nokiy
  labels:
    app.kubernetes.io/name: notion-sync
    app.kubernetes.io/instance: notion-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notion-sync
      app.kubernetes.io/instance: notion-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notion-sync
        app.kubernetes.io/instance: notion-sync
    spec:
      containers:
        - name: notion-sync
          image: ghcr.io/reonokiy/notion-sync:0.0.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: notion-sync-config
              mountPath: /etc/notion-sync/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: notion-sync-config
          secret:
            secretName: notion-sync-secrets
