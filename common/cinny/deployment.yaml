apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: cinny
  labels:
    app.kubernetes.io/name: cinny
    app.kubernetes.io/instance: cinny
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cinny
      app.kubernetes.io/instance: cinny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinny
        app.kubernetes.io/instance: cinny
    spec:
      containers:
        - name: cinny
          image: ghcr.io/cinnyapp/cinny:v4.10.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
