apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  values:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    service:
      enabled: true
      type: ClusterIP
      single: true
    ports:
      web:
        port: 80
        hostPort: 80
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        port: 443
        hostPort: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http3:
          enabled: true
          advertisedPort: 443
    providers:
      kubernetesGateway:
        enabled: true
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
