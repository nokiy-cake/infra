apiVersion: v1
kind: Service
metadata:
  name: traefik-tailscale
  namespace: traefik
  annotations:
    tailscale.com/hostname: traefik-default
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
