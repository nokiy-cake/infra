apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-only
  namespace: traefik
spec:
  chain:
    middlewares: []
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailscale-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10"  # Tailscale IP range
