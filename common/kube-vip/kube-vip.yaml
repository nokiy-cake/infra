apiVersion: v1
kind: Namespace
metadata:
  name: kube-vip
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kube-vip
  namespace: flux-system
spec:
  interval: 12h
  url: https://kube-vip.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-vip
spec:
  interval: 12h
  chart:
    spec:
      chart: kube-vip-cloud-provider
      version: "0.2.10"
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip-daemonset
  namespace: kube-vip
spec:
  interval: 12h
  chart:
    spec:
      chart: kube-vip
      version: "0.11.1"
      sourceRef:
        kind: HelmRepository
        name: kube-vip
        namespace: flux-system
  values:
    env:
      vip_interface: "eth0"
      vip_arp: "true"
      lb_enable: "false"
      vip_subnet: "32,128"
      cp_enable: "false"
      svc_enable: "true"
      svc_election: "false"
      vip_leaderelection: "false"
      prometheus_server: ":2112"
