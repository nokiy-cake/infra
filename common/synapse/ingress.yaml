---
# Certificate for synapse.nokiy.net and auth.synapse.nokiy.net
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synapse-nokiy-net
  namespace: synapse
spec:
  secretName: synapse-nokiy-net-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - synapse.nokiy.net
    - auth.synapse.nokiy.net
---
# Certificate for nokiy.net (for well-known endpoints)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nokiy-net
  namespace: synapse
spec:
  secretName: nokiy-net-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - nokiy.net
---
# Headers middleware for Synapse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: synapse-headers
  namespace: synapse
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
# CORS headers for well-known endpoints
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: matrix-wellknown-headers
  namespace: synapse
spec:
  headers:
    customResponseHeaders:
      Access-Control-Allow-Origin: "*"
      Content-Type: "application/json"
---
# Well-known endpoints for Matrix federation on nokiy.net
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-wellknown
  namespace: synapse
  annotations:
    external-dns.alpha.kubernetes.io/hostname: nokiy.net
    # external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nokiy.net`) && PathPrefix(`/.well-known/matrix`)
      kind: Rule
      services:
        - name: matrix-wellknown
          port: 80
  tls:
    secretName: nokiy-net-tls
---
# Main Synapse homeserver routes
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synapse-homeserver
  namespace: synapse
  annotations:
    external-dns.alpha.kubernetes.io/hostname: synapse.nokiy.net
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    # Auth endpoints (login/logout/refresh) - route to MAS
    - match: Host(`synapse.nokiy.net`) && PathRegexp(`^/_matrix/client/(.*)/(login|logout|refresh)`)
      kind: Rule
      priority: 20
      services:
        - name: mas
          port: 8080
      middlewares:
        - name: synapse-headers
    # Main Matrix endpoints - route to Synapse (match /_matrix or /_synapse/client)
    - match: Host(`synapse.nokiy.net`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse`))
      kind: Rule
      priority: 10
      services:
        - name: synapse
          port: 8008
      middlewares:
        - name: synapse-headers
  tls:
    secretName: synapse-nokiy-net-tls
---
# MAS auth service
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mas-auth
  namespace: synapse
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.synapse.nokiy.net
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.synapse.nokiy.net`)
      kind: Rule
      services:
        - name: mas
          port: 8080
      middlewares:
        - name: synapse-headers
  tls:
    secretName: synapse-nokiy-net-tls
