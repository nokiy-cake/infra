apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: synapse
  labels:
    app.kubernetes.io/name: synapse
    app.kubernetes.io/instance: synapse
    app.kubernetes.io/component: homeserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
      app.kubernetes.io/instance: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
        app.kubernetes.io/instance: synapse
        app.kubernetes.io/component: homeserver
    spec:
      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.144.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /data/homeserver.yaml
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /data/media_store
            - name: config
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
              readOnly: true
            - name: config
              mountPath: /data/homeserver.signing.key
              subPath: homeserver.signing.key
            - name: config
              mountPath: /data/key/homeserver.signing.key
              subPath: homeserver.signing.key.2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: synapse-media
        - name: config
          secret:
            secretName: synapse-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: synapse
  labels:
    app.kubernetes.io/name: mas
    app.kubernetes.io/instance: synapse
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mas
      app.kubernetes.io/instance: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mas
        app.kubernetes.io/instance: synapse
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service:1.10.0
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --config
            - /data/mas.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /data/mas.yaml
              subPath: mas.yaml
              readOnly: true
            - name: config
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: synapse-config
---
# Nginx deployment to serve well-known files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-wellknown
  namespace: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-wellknown
  template:
    metadata:
      labels:
        app: matrix-wellknown
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wellknown
              mountPath: /usr/share/nginx/html/.well-known/matrix
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: wellknown
          configMap:
            name: matrix-wellknown
        - name: nginx-config
          configMap:
            name: matrix-wellknown-nginx
