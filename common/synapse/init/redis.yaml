apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: synapse-redis
  namespace: synapse
spec:
  kubernetesConfig:
    image: redis:8
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redisExporter:
    enabled: false
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
