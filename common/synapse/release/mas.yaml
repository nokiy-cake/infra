apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: synapse
  labels:
    app.kubernetes.io/name: mas
    app.kubernetes.io/instance: synapse
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mas
      app.kubernetes.io/instance: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mas
        app.kubernetes.io/instance: synapse
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service:0.20.0
          imagePullPolicy: IfNotPresent
          command:
            - server
            - --config
            - /data/mas.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: mas-config
              mountPath: /data/mas.yaml
              subPath: mas.yaml
              readOnly: true
            - name: synapse-config
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: mas-config
          secret:
            secretName: mas-config
        - name: synapse-config
          secret:
            secretName: synapse-config
---
apiVersion: v1
kind: Service
metadata:
  name: mas
  namespace: synapse
  labels:
    app.kubernetes.io/name: mas
    app.kubernetes.io/instance: synapse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mas
    app.kubernetes.io/instance: synapse
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
