apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey-helm
  namespace: flux-system
spec:
  interval: 12h
  url: https://valkey-io.github.io/valkey-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mastodon-redis
  namespace: mastodon
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: valkey-helm
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: valkey-mastodon
    auth:
      enabled: true
      usersExistingSecret: mastodon-secrets
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: redis-password
    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: local-path
