apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mastodon-redis
  namespace: mastodon
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: valkey-mastodon
    architecture: standalone
    auth:
      enabled: true
      existingSecret: mastodon-secrets
      existingSecretPasswordKey: redis-password
    primary:
      persistence:
        enabled: true
        size: 1Gi
        storageClass: local-path
