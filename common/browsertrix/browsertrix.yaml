apiVersion: v1
kind: Namespace
metadata:
  name: browsertrix
  labels:
    app.kubernetes.io/name: browsertrix
    nokiy.net/cluster-secret-store: "production"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: browsertrix
  namespace: flux-system
spec:
  interval: 12h
  url: https://docs.browsertrix.com/helm-repo/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browsertrix
  namespace: browsertrix
spec:
  interval: 1h
  chart:
    spec:
      chart: browsertrix
      version: "1.21.5"
      sourceRef:
        kind: HelmRepository
        name: browsertrix
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    name: browsertrix-cloud
    mongo_local: true
    minio_local: true
    crawler_namespace: crawlers
    ingress:
      host: ""
