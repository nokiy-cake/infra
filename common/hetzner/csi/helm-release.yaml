apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hetzner-csi
  namespace: hetzner
spec:
  interval: 5m
  chart:
    spec:
      chart: hcloud-csi
      version: "2.18.1"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: flux-system
  values:
    controller:
      hcloudToken:
        existingSecret:
          name: hetzner-secrets
          key: token
    storageClasses:
      - name: hcloud-volumes
        defaultStorageClass: false
        reclaimPolicy: Retain
        annotations:
          resize.autoresize.io/enabled: "true"
      - name: hcloud-volumes-encrypted
        defaultStorageClass: false
        reclaimPolicy: Retain
        annotations:
          resize.autoresize.io/enabled: "true"
        extraParameters:
          csi.storage.k8s.io/node-publish-secret-name: hetzner-secrets
          csi.storage.k8s.io/node-publish-secret-namespace: hetzner
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
