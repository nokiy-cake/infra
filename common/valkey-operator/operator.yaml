apiVersion: v1
kind: Namespace
metadata:
  name: valkey-operator
---
# 用 OCIRepository 从 OCI Registry 拉 Helm Chart（Flux 推荐方式）
# 注意：spec.url 不能带 tag/digest，只能指向仓库路径本身:contentReference[oaicite:3]{index=3}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: valkey-operator-chart
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/hyperspike/valkey-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Hyperspike helm chart 的版本名是 "${LATEST}-chart":contentReference[oaicite:4]{index=4}
    # 例：如果 release 是 v0.0.61，则这里用 v0.0.61-chart
    tag: v0.0.61-chart
---
# HelmRelease 直接引用 OCIRepository（chartRef）:contentReference[oaicite:5]{index=5}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: valkey-operator
  targetNamespace: valkey-operator

  chartRef:
    kind: OCIRepository
    name: valkey-operator-chart
    namespace: flux-system

  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  # values: {}
