apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
    app.kubernetes.io/instance: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/instance: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
        app.kubernetes.io/instance: pocket-id
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: pocket-id
      initContainers:
        - name: litestream-restore
          image: litestream/litestream:0.5.1
          imagePullPolicy: IfNotPresent
          args:
            - restore
            - -if-db-not-exists
            - /data/pocket-id.db
          volumeMounts:
            - name: db
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

        # Fix permissions after restore (litestream runs as root)
        - name: fix-permissions
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /fix/db /fix/data
              chmod -R u+rwX,go+rX /fix/db /fix/data
          volumeMounts:
            - name: db
              mountPath: /fix/db
            - name: data
              mountPath: /fix/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

        - name: litestream
          image: litestream/litestream:0.5.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - replicate
          volumeMounts:
            - name: db
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v1.16.0-distroless
          imagePullPolicy: IfNotPresent
          ports:
            - name: pocket-id-port
              containerPort: 1411
              protocol: TCP
          env:
            - name: APP_URL
              value: "https://id.nokiy.net"
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: ENCRYPTION_KEY
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DB_CONNECTION_STRING
              value: "/app/data/db/pocket-id.db"
            - name: UPLOAD_PATH
              value: "/app/data/uploads"
          volumeMounts:
            - name: db
              mountPath: /app/data/db
            - name: data
              mountPath: /app/data/uploads
              subPath: uploads
            - name: data
              mountPath: /app/data/keys
              subPath: keys
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: pocket-id-db
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
        - name: litestream-config
          secret:
            secretName: litestream-secrets
