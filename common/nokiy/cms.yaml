apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nokiy-cms-secrets
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: nokiy-cms-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        nokiy.config.toml: |
          [log]
          level = "info"

          [api]
          url = "http://localhost:8080"

          [postgres]
          uri = "postgres://{{ .username }}:{{ .password }}@pooler-postgres-rw:5432/documents"

          [redis]
          uri = "redis://redis:6379/0"

          [cache]
          type = "fs"
          root = "/cache"

          [archive]
          type = "s3"
          endpoint = "http://localhost:9000"
          access_key_id = "minioadmin"
          secret_access_key = "minioadmin"
          bucket = "nokiy-archive"
          region = "us-east-1"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-nokiy-documents
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-nokiy-documents
        property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nokiy-cms
  labels:
    app: nokiy-cms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nokiy-cms
  template:
    metadata:
      labels:
        app: nokiy-cms
    spec:
      containers:
      - name: nokiy-cms
        image: git.nokiy.net/reonokiy/nokiy:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        args: ["server", "start"]
        volumeMounts:
        - name: config
          mountPath: /app/nokiy.config.toml
          subPath: nokiy.config.toml
          readOnly: true
        - name: cache
          mountPath: /cache
      volumes:
      - name: config
        secret:
          secretName: nokiy-cms-secrets
      - name: cache
        emptyDir:
          sizeLimit: 5Gi
