apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nokiy-web-secrets
  namespace: nokiy
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: nokiy-web-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        API_ENDPOINT: "http://nokiy-api"
        POSTGRES_DB: "auth"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        GITHUB_CLIENT_ID: "{{ .GITHUB_CLIENT_ID }}"
        GITHUB_CLIENT_SECRET: "{{ .GITHUB_CLIENT_SECRET }}"
        OIDC_PROVIDER_ID: "{{ .OIDC_PROVIDER_ID }}"
        OIDC_DISCOVERY_URL: "{{ .OIDC_DISCOVERY_URL }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres-nokiy-auth
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-nokiy-auth
        property: password
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: nokiy-web
        property: GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: nokiy-web
        property: GITHUB_CLIENT_SECRET
    - secretKey: OIDC_PROVIDER_ID
      remoteRef:
        key: nokiy-web
        property: OIDC_PROVIDER_ID
    - secretKey: OIDC_DISCOVERY_URL
      remoteRef:
        key: nokiy-web
        property: OIDC_DISCOVERY_URL
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: nokiy-web
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: nokiy-web
        property: OIDC_CLIENT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nokiy-web
  namespace: nokiy
  labels:
    app: nokiy-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nokiy-web
  template:
    metadata:
      labels:
        app: nokiy-web
    spec:
      containers:
      - name: nokiy-web
        image: git.nokiy.net/reonokiy/nokiy-web:main
        imagePullPolicy: Always
        ports:
        - containerPort: 4321
          name: http
        envFrom:
        - secretRef:
            name: nokiy-web-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nokiy-web
  namespace: nokiy
spec:
  selector:
    app: nokiy-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nokiy-web-internal-tls
  namespace: nokiy
spec:
  secretName: nokiy-web-internal-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - web.i.nokiy.net
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nokiy-web-tls
  namespace: nokiy
spec:
  secretName: nokiy-web-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - nokiy.net
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nokiy-web-internal-http
  namespace: nokiy
spec:
  entryPoints:
    - webinternal
  routes:
    - match: Host(`web.i.nokiy.net`)
      kind: Rule
      middlewares:
        - name: internal-redirect-https
          namespace: traefik
        - name: compress
          namespace: traefik
      services:
        - name: nokiy-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nokiy-web-internal
  namespace: nokiy
spec:
  entryPoints:
    - websecureinternal
  routes:
    - match: Host(`web.i.nokiy.net`)
      kind: Rule
      middlewares:
        - name: internal-redirect-https
          namespace: traefik
        - name: compress
          namespace: traefik
      services:
        - name: nokiy-web
          port: 80
  tls:
    secretName: nokiy-web-internal-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nokiy-web-http
  namespace: nokiy
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nokiy.net`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
        - name: compress
          namespace: traefik
      services:
        - name: nokiy-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nokiy-web
  namespace: nokiy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nokiy.net`)
      kind: Rule
      middlewares:
        - name: compress
          namespace: traefik
      services:
        - name: nokiy-web
          port: 80
  tls:
    secretName: nokiy-web-tls
