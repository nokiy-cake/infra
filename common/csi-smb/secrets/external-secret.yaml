  refreshPolicy: Periodic
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: smb-credentials-backup
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        username: "{{ .SMB_USERNAME }}"
        password: "{{ .SMB_PASSWORD }}"
        domain: "{{ .SMB_DOMAIN }}"
        source: "{{ .SMB_SOURCE }}"
  data:
  - secretKey: SMB_USERNAME
    remoteRef:
      key: smb-csi-backup
      property: USERNAME
  - secretKey: SMB_PASSWORD
    remoteRef:
      key: smb-csi-backup
      property: PASSWORD
  - secretKey: SMB_DOMAIN
    remoteRef:
      key: smb-csi-backup
      property: DOMAIN
  - secretKey: SMB_SOURCE
    remoteRef:
      key: smb-csi-backup
