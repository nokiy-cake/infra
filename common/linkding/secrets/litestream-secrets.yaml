---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litestream-secrets
  namespace: linkding
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    name: litestream-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        litestream.yml: |
          access-key-id: {{ .aws_access_key_id | quote }}
          secret-access-key: {{ .aws_secret_access_key | quote }}
          
          dbs:
            - path: /etc/linkding/data/db.sqlite3
              replicas:
                - type: s3
                  bucket: backup
                  path: linkding-litestream
                  endpoint: https://nokiy.net
                  force-path-style: false

  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: backup.nokiy.net
        property: ACCESS_KEY
    - secretKey: aws_secret_access_key
      remoteRef:
        key: backup.nokiy.net
        property: SECRET_KEY
