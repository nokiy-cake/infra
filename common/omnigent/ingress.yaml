apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnigent
  namespace: omnigent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: omnigent.nokiy.net
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  ingressClassName: traefik
  rules:
    - host: omnigent.nokiy.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnigent
                port:
                  number: 80
  tls:
    - hosts:
        - omnigent.nokiy.net
      secretName: omnigent-tls
