---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: header-echo
  namespace: header-echo
  labels:
    app.kubernetes.io/name: header-echo
    app.kubernetes.io/instance: header-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: header-echo
      app.kubernetes.io/instance: header-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: header-echo
        app.kubernetes.io/instance: header-echo
    spec:
      containers:
        - name: header-echo
          image: mendhak/http-https-echo:38
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: header-echo
  namespace: header-echo
  labels:
    app.kubernetes.io/name: header-echo
    app.kubernetes.io/instance: header-echo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: header-echo
    app.kubernetes.io/instance: header-echo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
