apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sing-box-config
  namespace: sing-box
spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: sing-box-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        config.json: |-
          {
              "log": {
                  "level": "info",
                  "timestamp": true
              },
              "dns": {
                  "servers": [
                      {
                          "tag": "dns:google",
                          "type": "udp",
                          "server": "8.8.8.8",
                          "server_port": 53,
                          "detour": "out:direct"
                      },
                      {
                          "tag": "dns:cloudflare",
                          "type": "h3",
                          "server": "1.1.1.1",
                          "server_port": 443
                      }
                  ]
              },
              "ntp": {
                  "enabled": true,
                  "server": "pool.ntp.org",
                  "server_port": 123,
                  "interval": "60m",
                  "detour": "out:direct",
                  "domain_resolver": {
                      "server": "dns:google",
                      "strategy": "ipv4_only",
                      "disable_cache": false
                  }
              },
              "inbounds": [
                  {
                      "type": "vless",
                      "tag": "in:vless",
                      "listen": "::",
                      "listen_port": 443,
                      "users": [
                          {
                              "name": "direct",
                              "uuid": "{{ .DIRECT_UUID }}",
                              "flow": "xtls-rprx-vision"
                          },
                          {
                              "name": "warp",
                              "uuid": "{{ .WARP_UUID }}",
                              "flow": "xtls-rprx-vision"
                          }
                      ],
                      "tls": {
                          "enabled": true,
                          "server_name": "{{ .DOMAIN }}",
                          "reality": {
                              "enabled": true,
                              "handshake": {
                                  "server": "{{ .DOMAIN }}",
                                  "server_port": 443
                              },
                              "private_key": "{{ .PRIVATE_KEY }}",
                              "short_id": [
                                  "{{ .SHORT_ID }}"
                              ]
                          }
                      },
                      "multiplex": {
                          "enabled": true,
                          "padding": true
                      }
                  },
                  {
                      "type": "anytls",
                      "tag": "in:anytls",
                      "listen": "::",
                      "listen_port": 444,
                      "users": [
                          {
                              "name": "{{ .NAME1 }}",
                              "password": "{{ .PASSWORD1 }}"
                          }
                      ],
                      "padding_scheme": [
                          "stop=8",
                          "0=30-30",
                          "1=100-400",
                          "2=400-500,c,500-1000,c,500-1000,c,500-1000,c,500-1000,c,500-1000",
                          "3=9-9,500-1000",
                          "4=500-1000",
                          "5=500-1000",
                          "6=500-1000",
                          "7=500-1000"
                      ],
                      "tls": {
                          "enabled": true,
                          "server_name": "{{ .DOMAIN1 }}",
                          "reality": {
                              "enabled": true,
                              "handshake": {
                                  "server": "{{ .DOMAIN1 }}",
                                  "server_port": 443
                              },
                              "private_key": "{{ .PRIVATE_KEY1 }}",
                              "short_id": [
                                  "{{ .SHORT_ID1 }}"
                              ]
                          }
                      }
                  }
              ],
              "endpoints": [
                  {
                      "tag": "out:warp",
                      "type": "wireguard",
                      "system": false,
                      "address": [
                          "{{ .WARP_IPV4 }}",
                          "{{ .WARP_IPV6 }}"
                      ],
                      "mtu": 1280,
                      "private_key": "{{ .WARP_PRIVATE_KEY }}",
                      "peers": [
                          {
                              "address": "engage.cloudflareclient.com",
                              "port": 2408,
                              "public_key": "{{ .WARP_PUBLIC_KEY }}",
                              "allowed_ips": [
                                  "0.0.0.0/0",
                                  "::/0"
                              ],
                              "persistent_keepalive_interval": 10
                          }
                      ],
                      "domain_resolver": {
                          "server": "dns:cloudflare",
                          "strategy": "ipv4_only",
                          "disable_cache": false
                      }
                  }
              ],
              "outbounds": [
                  {
                      "tag": "out:direct",
                      "type": "direct",
                      "tcp_fast_open": true,
                      "tcp_multi_path": true,
                      "domain_resolver": {
                          "server": "dns:cloudflare",
                          "strategy": "ipv4_only",
                          "disable_cache": false
                      }
                  }
              ],
              "route": {
                  "rules": [
                      {
                          "ip_is_private": true,
                          "outbound": [
                              "out:direct",
                              "out:warp"
                          ],
                          "action": "reject"
                      },
                      {
                          "inbound": [
                              "in:vless"
                          ],
                          "auth_user": "direct",
                          "action": "route",
                          "outbound": "out:direct"
                      },
                      {
                          "inbound": [
                              "in:vless"
                          ],
                          "auth_user": "warp",
                          "action": "route",
                          "outbound": "out:warp"
                      },
                      {
                          "inbound": [
                              "in:anytls"
                          ],
                          "action": "route",
                          "outbound": "out:direct"
                      }
                  ],
                  "default_domain_resolver": {
                      "server": "dns:cloudflare"
                  },
                  "final": "out:warp"
              }
          }
  data:
    - secretKey: DIRECT_UUID
      remoteRef:
        key: sing-box
        property: DIRECT_UUID
    - secretKey: WARP_UUID
      remoteRef:
        key: sing-box
        property: WARP_UUID
    - secretKey: DOMAIN
      remoteRef:
        key: sing-box
        property: DOMAIN
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: sing-box
        property: PRIVATE_KEY
    - secretKey: SHORT_ID
      remoteRef:
        key: sing-box
        property: SHORT_ID
    - secretKey: NAME1
      remoteRef:
        key: sing-box
        property: NAME1
    - secretKey: PASSWORD1
      remoteRef:
        key: sing-box
        property: PASSWORD1
    - secretKey: DOMAIN1
      remoteRef:
        key: sing-box
        property: DOMAIN1
    - secretKey: PRIVATE_KEY1
      remoteRef:
        key: sing-box
        property: PRIVATE_KEY1
    - secretKey: SHORT_ID1
      remoteRef:
        key: sing-box
        property: SHORT_ID1
    - secretKey: WARP_IPV4
      remoteRef:
        key: sing-box
        property: WARP_IPV4
    - secretKey: WARP_IPV6
      remoteRef:
        key: sing-box
        property: WARP_IPV6
    - secretKey: WARP_PRIVATE_KEY
      remoteRef:
        key: sing-box
        property: WARP_PRIVATE_KEY
    - secretKey: WARP_PUBLIC_KEY
      remoteRef:
        key: sing-box
        property: WARP_PUBLIC_KEY
