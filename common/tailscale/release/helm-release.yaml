apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: tailscale-secrets
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-secrets
      valuesKey: client_secret
      targetPath: oauth.clientSecret
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
