apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-monitoring-credentials
  namespace: k8s-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: k8s-monitoring-credentials
    creationPolicy: Owner
  data:
    - secretKey: grafana-cloud-access-policy-token
      remoteRef:
        key: monitoring
        property: PASSWORD
