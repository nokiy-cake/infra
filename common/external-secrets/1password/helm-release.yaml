apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password-connect
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: connect
      version: "2.0.5"
      sourceRef:
        kind: HelmRepository
        name: 1password
        namespace: flux-system
  values:
    connect:
      tls:
        enabled: false # cannot use https due to https://github.com/external-secrets/external-secrets/issues/4515
        secret: op-connect-tls-secret
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
