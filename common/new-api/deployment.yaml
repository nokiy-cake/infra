---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: new-api
  labels:
    app.kubernetes.io/name: new-api
    app.kubernetes.io/instance: new-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: new-api
      app.kubernetes.io/instance: new-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: new-api
        app.kubernetes.io/instance: new-api
    spec:
      containers:
        - name: new-api
          image: calciumion/new-api:v1.0.0-rc.15
          imagePullPolicy: IfNotPresent
          args:
            - --log-dir
            - /app/logs
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-app
                  key: uri
            - name: REDIS_CONN_STRING
              value: redis://valkey-new-api.new-api.svc.cluster.local:6379
            - name: TZ
              value: Asia/Shanghai
            - name: ERROR_LOG_ENABLED
              value: "true"
            - name: BATCH_UPDATE_ENABLED
              value: "true"
            - name: SQL_MAX_OPEN_CONNS
              value: "50"
            - name: SQL_MAX_IDLE_CONNS
              value: "10"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STREAMING_TIMEOUT
              value: "300"
            - name: RELAY_IDLE_CONN_TIMEOUT
              value: "90"
          envFrom:
            - secretRef:
                name: new-api-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: logs
          emptyDir: {}
